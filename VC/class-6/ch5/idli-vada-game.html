<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Idli-Vada Speed Challenge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f4f6f9; color: #333; }
    header { background-color: #1a5276; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    .logo { color: #ff69b4; font-size: 28px; font-weight: bold; text-decoration: none; }
    nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }
    .container { max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
    .card-box { background: white; border: 2px solid #2471a3; border-radius: 8px; padding: 30px; }
    h2 { color: #1a5276; margin-bottom: 15px; }
    .stats { display: flex; justify-content: space-around; font-size: 18px; font-weight: bold; color: #1a5276; margin-bottom: 20px; }
    .timer-bar-bg { width: 100%; background: #e0e0e0; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
    #timer-bar { width: 100%; height: 100%; background: #27ae60; transition: width 0.1s linear, background-color 0.3s; }
    #number-display { font-size: 64px; font-weight: bold; color: #2471a3; margin: 10px 0 20px 0; }
    .btn-container { display: flex; justify-content: center; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
    .game-btn { background: #1a5276; color: white; border: none; padding: 15px 25px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .game-btn:hover:not(:disabled) { background: #ff69b4; transform: translateY(-2px); }
    .game-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #feedback { margin-top: 20px; font-size: 20px; font-weight: bold; min-height: 30px; }
    #restart-btn { background: #27ae60; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; display: none; }
    #restart-btn:hover { background: #1e8449; }
  </style>
</head>
<body>

  <header>
    <a href="../../../index.html" class="logo">M T</a>
    <nav>
      <a href="../../../index.html">Home</a>
      <a href="index.html">← Back to Ch 5</a>
    </nav>
  </header>

  <div class="container">
    <div class="card-box">
      <h2>Idli-Vada Speed Challenge</h2>
      <p style="color: #555; margin-bottom: 15px;">Answer quickly for maximum points!</p>

      <div class="stats">
        <div>Round: <span id="round-count">1</span> / 10</div>
        <div>Score: <span id="score-display">0</span></div>
      </div>

      <div class="timer-bar-bg">
        <div id="timer-bar"></div>
      </div>

      <div id="number-display">--</div>

      <div class="btn-container">
        <button class="game-btn" onclick="makeChoice('idli')">Idli (÷3)</button>
        <button class="game-btn" onclick="makeChoice('vada')">Vada (÷5)</button>
        <button class="game-btn" onclick="makeChoice('idli-vada')">Idli-Vada (÷15)</button>
      </div>

      <div id="feedback"></div>
      <button id="restart-btn" onclick="startGame()">Play Again</button>
    </div>
  </div>

  <script>
    let currentNumber = 0;
    let score = 0;
    let round = 1;
    const maxRounds = 10;
    
    // Timer Variables
    let timerInterval = null;
    let timeLeft = 5.0; // 5 seconds per round
    const maxTime = 5.0;

    function getRandomNumber() {
      const factors = [3, 5, 15];
      const baseFactor = factors[Math.floor(Math.random() * factors.length)];
      const multiplier = Math.floor(Math.random() * 10) + 1;
      return baseFactor * multiplier;
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = maxTime;
      updateTimerUI();

      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) {
          timeLeft = 0;
          updateTimerUI();
          clearInterval(timerInterval);
          handleTimeOut();
        } else {
          updateTimerUI();
        }
      }, 100);
    }

    function updateTimerUI() {
      const percentage = (timeLeft / maxTime) * 100;
      const bar = document.getElementById('timer-bar');
      bar.style.width = percentage + "%";

      if (percentage > 50) {
        bar.style.backgroundColor = "#27ae60";
      } else if (percentage > 25) {
        bar.style.backgroundColor = "#f39c12";
      } else {
        bar.style.backgroundColor = "#e74c3c";
      }
    }

    function nextRound() {
      if (round > maxRounds) {
        endGame();
        return;
      }

      document.getElementById('round-count').innerText = round;
      currentNumber = getRandomNumber();
      document.getElementById('number-display').innerText = currentNumber;
      startTimer();
    }

    function makeChoice(choice) {
      if (round > maxRounds || timeLeft <= 0) return;

      clearInterval(timerInterval);

      let expected = "";
      if (currentNumber % 15 === 0) expected = 'idli-vada';
      else if (currentNumber % 3 === 0) expected = 'idli';
      else if (currentNumber % 5 === 0) expected = 'vada';

      const fb = document.getElementById('feedback');

      if (choice === expected) {
        // Speed score calculation (Max 100 pts per round)
        const roundPoints = Math.round((timeLeft / maxTime) * 80) + 20;
        score += roundPoints;
        fb.innerText = `⚡ Fast! +${roundPoints} Points`;
        fb.style.color = "#27ae60";
      } else {
        fb.innerText = `Wrong! ${currentNumber} needed ${expected.toUpperCase()}`;
        fb.style.color = "#c0392b";
      }

      document.getElementById('score-display').innerText = score;
      round++;

      setTimeout(() => {
        if (round <= maxRounds) {
          fb.innerText = "";
          nextRound();
        } else {
          endGame();
        }
      }, 1200);
    }

    function handleTimeOut() {
      const fb = document.getElementById('feedback');
      fb.innerText = "⏰ Time's up!";
      fb.style.color = "#e74c3c";
      round++;

      setTimeout(() => {
        if (round <= maxRounds) {
          fb.innerText = "";
          nextRound();
        } else {
          endGame();
        }
      }, 1200);
    }

    function endGame() {
      clearInterval(timerInterval);
      document.getElementById('number-display').innerText = "Game Over!";
      const fb = document.getElementById('feedback');
      fb.innerText = `Final Score: ${score} Points!`;
      fb.style.color = "#1a5276";

      const buttons = document.querySelectorAll('.game-btn');
      buttons.forEach(btn => btn.disabled = true);
      document.getElementById('restart-btn').style.display = "inline-block";
    }

    function startGame() {
      score = 0;
      round = 1;
      document.getElementById('score-display').innerText = score;
      document.getElementById('feedback').innerText = "";
      document.getElementById('restart-btn').style.display = "none";

      const buttons = document.querySelectorAll('.game-btn');
      buttons.forEach(btn => btn.disabled = false);

      nextRound();
    }

    startGame();
  </script>
</body>
</html>
