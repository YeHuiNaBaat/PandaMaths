<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NCERT Class 6 - Supercell Explorer</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 30px; background-color: #f8f9fa; }
    h1 { color: #2c3e50; }
    p { color: #555; max-width: 600px; margin: 0 auto 20px auto; }
    .grid-container { display: flex; justify-content: center; gap: 8px; margin: 25px 0; flex-wrap: wrap; }
    .cell-input { width: 70px; height: 60px; font-size: 18px; text-align: center; border: 2px solid #bdc3c7; border-radius: 8px; transition: all 0.2s ease; }
    .cell-input.supercell { background-color: #2ecc71; color: white; border-color: #27ae60; font-weight: bold; transform: scale(1.05); }
    .status-board { background-color: #fff; border-radius: 8px; padding: 15px; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <h1>Supercell Interactive Explorer</h1>
  <p>A cell becomes a <strong>Supercell</strong> when its number is strictly larger than all of its adjacent neighbouring cells. Edit the values below to test strategies!</p>

  <div class="grid-container" id="cellGrid"></div>

  <div class="status-board">
    <h3>Total Supercells Found: <span id="supercellCount" style="color: #27ae60;">0</span></h3>
  </div>

  <script>
    // Initial values from NCERT Class 6 Section 3.2 Page 57
    const initialData = [6828, 670, 9435, 3780, 3708, 7308, 8000, 5583, 52];
    const gridContainer = document.getElementById('cellGrid');
    const supercellCountDisplay = document.getElementById('supercellCount');

    // Generate Inputs
    initialData.forEach((val, idx) => {
      const input = document.createElement('input');
      input.type = 'number';
      input.className = 'cell-input';
      input.value = val;
      input.dataset.index = idx;
      input.addEventListener('input', updateSupercells);
      gridContainer.appendChild(input);
    });

    function updateSupercells() {
      const inputs = Array.from(document.querySelectorAll('.cell-input'));
      const values = inputs.map(input => parseFloat(input.value) || 0);
      let count = 0;

      inputs.forEach((input, i) => {
        const currentVal = values[i];
        const leftVal = i > 0 ? values[i - 1] : -Infinity;
        const rightVal = i < values.length - 1 ? values[i + 1] : -Infinity;

        // Check if strictly greater than existing adjacent neighbours
        if (currentVal > leftVal && currentVal > rightVal) {
          input.classList.add('supercell');
          count++;
        } else {
          input.classList.remove('supercell');
        }
      });

      supercellCountDisplay.textContent = count;
    }

    // Initial calculation on load
    updateSupercells();
  </script>
</body>
</html>
