<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PandaMaths Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f4f6f9; color: #333; }
    header {
      background-color: #1a5276;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .logo { color: #ff69b4; font-size: 28px; font-weight: 800; text-decoration: none; }
    nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: 600; }
    nav a:hover { color: #ff69b4; }
    .hero { text-align: center; margin-top: 60px; padding: 20px; }
    .hero h1 { color: #1a5276; font-size: 32px; margin-bottom: 15px; }
    .hero p { color: #555; font-size: 18px; margin-bottom: 30px; }
    .class-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; max-width: 800px; margin: 0 auto; }
    .class-card {
      background: white;
      border: 2px solid #2471a3;
      color: #1a5276;
      padding: 20px 35px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .class-card:hover { background-color: #ff69b4; color: white; border-color: #ff69b4; transform: translateY(-3px); }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">M T</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="VC/class-6/index.html">Class VI</a>
      <a href="VC/class-10/ch8.html">Class X</a>
    </nav>
  </header>

  <div class="hero">
    <h1>Welcome to PandaMaths Portal</h1>
    <p>Select a class below to access interactive chapter resources:</p>

    <div class="class-grid">
      <a href="VC/class-6/index.html" class="class-card">Class VI Resources</a>
      <a href="VC/class-10/ch8.html" class="class-card">Class X Resources</a>
    </div>
  </div>

</body>
</html>
